[package]
name = "cdate"
version = "0.3.2"
edition = "2024"
rust-version = "1.94"
description = "Locale-correct date formats for formal correspondence"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cdate"

documentation = "https://docs.rs/cdate"
keywords = ["i18n", "correspondence", "locale"]
categories = ["internationalization", "text-processing"]

include = ["Cargo.toml", "Cargo.lock", "src/**", "tables/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "LICENSE.md", "LICENSES/Apache-2.0.txt", "LICENSES/GPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/LGPL-3.0-only.txt"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
